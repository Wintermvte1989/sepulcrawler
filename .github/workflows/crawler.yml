name: Sepulkral Event Crawler

on:
  schedule:
    # Läuft täglich um 04:00 Uhr UTC (06:00 Uhr deutscher Sommerzeit)
    - cron: '0 4 * * *'
  workflow_dispatch: # Erlaubt manuelles Ausführen über die GitHub-Oberfläche

permissions:
  contents: write # Erlaubt das Zurückschreiben von aktualisierten JSON-/HTML-Dateien

jobs:
  run-crawler:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install google-genai beautifulsoup4 httpx pydantic

      - name: Crawler ausführen
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python parser.py

      - name: Änderungen speichern (Git Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatisches Event-Update" && git pull --rebase origin main && git push)